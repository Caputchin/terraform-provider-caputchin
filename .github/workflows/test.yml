name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -timeout=120s

      - uses: golangci/golangci-lint-action@v6
        with:
          # Must be built with Go >= the go.mod toolchain (go1.24.x); v1.62.2's
          # official binary is built with go1.23 and refuses to lint a 1.24 target.
          version: v1.64.8

      - name: install tfplugindocs
        run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.20.1

      - name: generated docs are in sync
        run: |
          tfplugindocs generate --provider-name caputchin
          if ! git diff --quiet -- docs/; then
            echo "::error::generated docs are out of sync; run 'make docs' and commit the result"
            git --no-pager diff -- docs/
            exit 1
          fi
